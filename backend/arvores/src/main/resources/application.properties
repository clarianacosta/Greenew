# ===================================================================
# CONFIGURACAO DO SERVIDOR
# ===================================================================
server.port=8081


# ===================================================================
# CONFIGURACAO DA APLICACAO SPRING
# ===================================================================
spring.application.name=ARVORES-SERVICE
spring.devtools.restart.enabled=false


# ===================================================================
# CONFIGURACAO DO BANCO DE DADOS (DATASOURCE)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/servico_arvores_db
spring.datasource.username=admin
spring.datasource.password=Unitau@123
spring.datasource.driver-class-name=org.postgresql.Driver


# ===================================================================
# CONFIGURACAO DO SPRING DATA JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# ===================================================================
# CONFIGURACAO DO CLIENTE EUREKA
# ===================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/