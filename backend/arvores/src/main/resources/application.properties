# ===================================================================
# CONFIGURA플O DO SERVIDOR
# ===================================================================
server.port=8081


# ===================================================================
# CONFIGURA플O DA APLICA플O SPRING
# ===================================================================
spring.application.name=arvores-service


# ===================================================================
# CONFIGURA플O DO BANCO DE DADOS (DATASOURCE)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/servico_arvores_db
spring.datasource.username=admin
spring.datasource.password=Unitau@123
spring.datasource.driver-class-name=org.postgresql.Driver


# ===================================================================
# CONFIGURA플O DO SPRING DATA JPA / HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


