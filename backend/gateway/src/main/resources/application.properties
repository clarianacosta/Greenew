# ===================================================================
# CONFIGURACAO DO SERVIDOR
# ===================================================================
server.port=8762

# ===================================================================
# CONFIGURACAO DA APLICACAO SPRING
# ===================================================================
spring.application.name=API-GATEWAY
spring.devtools.restart.enabled=false

# ===================================================================
# CONFIGURACAO DO CLIENTE EUREKA
# ===================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===================================================================
# CONFIGURACAO DO GATEWAY
# ===================================================================
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# --- ROTAS PARA ARVORES-SERVICE ---
# Rota 1: /api/arvores/**
spring.cloud.gateway.routes[0].id=arvores-service-paths
spring.cloud.gateway.routes[0].uri=lb://ARVORES-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/arvores/**

# Rota 2: /api/climas/**
spring.cloud.gateway.routes[1].id=climas-service-paths
spring.cloud.gateway.routes[1].uri=lb://ARVORES-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/climas/**

# Rota 3: /api/biomas/**
spring.cloud.gateway.routes[2].id=biomas-service-paths
spring.cloud.gateway.routes[2].uri=lb://ARVORES-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/biomas/**


# --- ROTAS PARA PRODUTORES-SERVICE ---
# Rota 4: /api/produtores/**
spring.cloud.gateway.routes[3].id=produtores-service-paths
spring.cloud.gateway.routes[3].uri=lb://PRODUTORES-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/produtores/**

# Rota 5: /api/terrenos/**
spring.cloud.gateway.routes[4].id=terrenos-service-paths
spring.cloud.gateway.routes[4].uri=lb://PRODUTORES-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/terrenos/**


# --- ROTA PARA EMPRESAS-SERVICE ---
# Rota 6: /api/empresas/**
spring.cloud.gateway.routes[5].id=empresas-service-paths
spring.cloud.gateway.routes[5].uri=lb://EMPRESAS-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/empresas/**


# --- ROTAS PARA RELATORIOS-SERVICE ---
# Rota 7: /api/relatorios/**
spring.cloud.gateway.routes[6].id=relatorios-service-paths
spring.cloud.gateway.routes[6].uri=lb://RELATORIOS-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/relatorios/**

# Rota 8: /api/fatores-emissao/**
spring.cloud.gateway.routes[7].id=fatores-emissao-service-paths
spring.cloud.gateway.routes[7].uri=lb://RELATORIOS-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/fatores-emissao/**