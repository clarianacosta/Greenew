# ===================================================================
# CONFIGURACAO DO SERVIDOR
# ===================================================================
server.port=8762

# ===================================================================
# CONFIGURACAO DA APLICACAO SPRING
# ===================================================================
spring.application.name=API-GATEWAY
spring.devtools.restart.enabled=false

# ===================================================================
# CONFIGURACAO DO EUREKA CLIENTE
# ===================================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ===================================================================
# CONFIGURACAO DO GATEWAY
# ===================================================================
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# --- ROTA PARA ARVORES-SERVICE ---
spring.cloud.gateway.routes[0].id=arvores-service
spring.cloud.gateway.routes[0].uri=lb://ARVORES-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/arvores/**
spring.cloud.gateway.routes[0].predicates[1]=Path=/api/climas/**
spring.cloud.gateway.routes[0].predicates[2]=Path=/api/biomas/**

# --- ROTA PARA PRODUTORES-SERVICE ---
spring.cloud.gateway.routes[1].id=produtores-service
spring.cloud.gateway.routes[1].uri=lb://PRODUTORES-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/produtores/**
spring.cloud.gateway.routes[1].predicates[1]=Path=/api/terrenos/**

# --- ROTA PARA EMPRESAS-SERVICE ---
spring.cloud.gateway.routes[2].id=empresas-service
spring.cloud.gateway.routes[2].uri=lb://EMPRESAS-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/empresas/**

# --- ROTA PARA RELATORIOS-SERVICE ---
spring.cloud.gateway.routes[3].id=relatorios-service
spring.cloud.gateway.routes[3].uri=lb://RELATORIOS-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/relatorios/**
spring.cloud.gateway.routes[3].predicates[1]=Path=/api/fatores-emissao/**